{% extends 'base.html' %}

{% block title %}Broadcast Announcement | Yarra{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Broadcast Announcement</h1>
        <p class="muted">Send a notification to every school, or a specific membership tier.</p>
    </div>
    <a href="{% url 'admin_dashboard' %}" class="button secondary">Back to Dashboard</a>
</div>

<div class="card" style="max-width: 640px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <div class="form-group">
            <label for="tier">Audience</label>
            <select id="tier" name="tier">
                <option value="">All schools</option>
                {% for value, label in tier_choices %}
                    <option value="{{ value }}">{{ label }} tier only</option>
                {% endfor %}
            </select>
        </div>
        <div class="button-group">
            <button type="submit" class="button primary">Send Announcement</button>
        </div>
    </form>
</div>
{% endblock %}
